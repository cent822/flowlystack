name: Release

# Runs when a tag like v0.1.0 is pushed. In order: the same checks as every push, a check that the tag matches pyproject.toml and
# CHANGELOG.md, a start-from-empty test of the image, then the multi-architecture image on GHCR and a GitHub Release with
# SHA256SUMS. Nothing is published if any step before it fails. Actions are pinned to full commit hashes.
on:
  push:
    tags: ["v*"]

# No permissions by default; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Checks
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  verify:
    name: Tag, version and release notes agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/release_notes.py check "$TAG"

  build:
    name: Image (test, then publish)
    needs: [ci, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name (GHCR needs lower case)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          # v0.1.0 -> :0.1.0 and :latest; a pre-release like v0.1.0-rc1 -> :0.1.0-rc1 only (latest=auto).
          tags: type=semver,pattern={{version}}
          flavor: latest=auto
          # Title and description are pinned here: left alone, the title would be the repository name (flowlystack) and the description
          # whatever the About box says. They must equal the Dockerfile's (scripts/check_image_labels.py). Source and url follow the
          # repository automatically.
          labels: |
            org.opencontainers.image.title=FlowlyStack
            org.opencontainers.image.description=A private workspace on your own computer to keep, connect and plan your AI prompts.
      # 1. Build the amd64 image into the local Docker and prove it starts from empty, BEFORE anything is published.
      - name: Build amd64 for the test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: flowlystack:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Starts-empty test
        run: python3 scripts/smoke_image.py flowlystack:smoke
      # 2. Build both architectures from the same Dockerfile (amd64 comes from the cache) and push.
      - name: Build and push amd64 + arm64
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Release notes, files and checksums
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir -p release
          # Notes: exactly this version's CHANGELOG block, then where the image is and how to check it.
          python scripts/release_notes.py notes "$VERSION" > release/notes.md
          {
            echo
            echo "### Docker image"
            echo
            echo "\`${IMAGE}:${VERSION}\` (linux/amd64 and linux/arm64)"
            echo
            echo "Digest: \`${DIGEST}\`. To run exactly this build: \`docker pull ${IMAGE}@${DIGEST}\`."
            echo
            echo "### Checking your download"
            echo
            echo "\`SHA256SUMS\` lists the checksum of each file below. Run \`shasum -a 256 -c SHA256SUMS\` (macOS) or \`sha256sum -c SHA256SUMS\` (Linux) in the folder with the files."
            echo "It protects against a damaged or mixed-up download. It cannot prove who published the release, because it is published in the same place as the files."
          } >> release/notes.md
          # The files a person downloads and runs, plus the source.
          # GitHub refuses release file names that start with a dot (it renames them), so .env.example is published as env.example.
          cp install.sh install.ps1 docker-compose.yml release/
          cp .env.example release/env.example
          git archive --format=tar.gz --prefix="flowlystack-${VERSION}/" -o "release/flowlystack-${VERSION}-source.tar.gz" "$TAG"
          (cd release && sha256sum install.sh install.ps1 docker-compose.yml env.example "flowlystack-${VERSION}-source.tar.gz" > SHA256SUMS && cat SHA256SUMS)
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PRE=""
          if [ "$(python scripts/release_notes.py prerelease "$TAG")" = "true" ]; then PRE="--prerelease"; fi
          gh release create "$TAG" --verify-tag $PRE --title "FlowlyStack ${VERSION}" --notes-file release/notes.md \
            release/install.sh release/install.ps1 release/docker-compose.yml release/env.example \
            "release/flowlystack-${VERSION}-source.tar.gz" release/SHA256SUMS
