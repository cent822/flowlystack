name: Feature request
description: Suggest an idea or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for sharing an idea. Please search the existing issues first.

        FlowlyStack stays local (no cloud, no tracking) and simple (plain files, no build step). Ideas that fit that are the easiest to say yes to.
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
      description: Describe what you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Your idea, in your own words. Sketches are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you have tried
      description: Workarounds or alternatives you considered.
    validations:
      required: false
  - type: dropdown
    id: help
    attributes:
      label: Would you like to help build it?
      options:
        - "Yes"
        - Maybe, with some guidance
        - "No, I am only suggesting it"
    validations:
      required: false
