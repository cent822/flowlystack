name: Bug report
description: Something does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this. Please search the existing issues first.

        **Do not paste your prompts, tokens, passwords or personal data here.** Remove them first.
        Found a security problem? Please do not open a public issue; use the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what you saw. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FlowlyStack version
      description: Shown in Settings, under About.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options:
        - Docker
        - One-line installer
        - From source (./run.sh)
        - Other
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and browser
      placeholder: "macOS 15, Safari 18"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      description: Anything from the terminal, the container log or the browser console. Remove private text first.
      render: shell
    validations:
      required: false
